<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <title>Lumen Atlas · 光影图谱</title>
    <meta
      name="description"
      content="探索实时 3D 光影场景，在网页中欣赏、静心和助眠，兼容设备可进入沉浸体验。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236ea8ff'/%3E%3Cstop offset='1' stop-color='%23a06bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="xr-canvas" aria-hidden="true"></canvas>

    <div class="ambient" aria-hidden="true">
      <span class="blob blob--a"></span>
      <span class="blob blob--b"></span>
      <span class="blob blob--c"></span>
      <div class="grain"></div>
    </div>

    <header class="masthead">
      <a class="brand" href="./index.html">
        <span class="brand__mark"></span>
        <span class="brand__text">Lumen<span>Atlas</span></span>
      </a>
      <div class="masthead__meta">
        <span class="chip chip--xr" id="xr-chip">检测 WebXR…</span>
        <span class="chip" id="scene-count">— 个场景</span>
      </div>
    </header>

    <main>
      <section class="hero">
        <p class="hero__eyebrow">Lumen Atlas · 实时光影与空间体验</p>
        <h1 class="hero__title">探索 3D 光影<br />走进不同的世界</h1>
        <p class="hero__lede">
          <span data-scene-count></span> 个实时场景，从星河、雨夜到一间静室。直接在网页中探索，
          或选择一段安静的光影陪你静心、助眠。兼容头显可进一步进入沉浸体验。
        </p>
        <div class="hero__actions">
          <button class="btn btn--primary" id="scroll-gallery">浏览场景</button>
          <a class="btn btn--ghost" href="./scene.html?id=breathing">开始静心冥想</a>
          <button class="btn btn--ghost" id="enter-xr" aria-describedby="xr-note" disabled>进入沉浸体验</button>
        </div>
        <p class="hero__note" id="xr-note" role="status"></p>
      </section>

      <section class="gallery" id="gallery">
        <div class="section-head">
          <h2>场景索引</h2>
          <label class="gallery-search">搜索场景<input id="scene-search" type="search" maxlength="120" placeholder="搜索名称、氛围或标签" /></label>
        </div>
        <div class="gallery-toolbar">
          <div class="collections" role="group" aria-label="浏览范围">
            <button class="filter" data-collection="all" aria-pressed="true">全部场景</button>
            <button class="filter" data-collection="favorites" aria-pressed="false">我的收藏</button>
            <button class="filter" data-collection="recent" aria-pressed="false">最近使用</button>
          </div>
          <div class="filters" id="filters" role="group" aria-label="场景分类"></div>
          <p id="result-count" role="status"></p>
        </div>
        <div class="grid" id="grid"></div>
        <div class="gallery-empty" id="gallery-empty" hidden>
          <p>这里还没有匹配的场景。可以调整关键词，或先收藏、体验喜欢的场景。</p>
          <button class="btn btn--ghost" id="reset-filters">浏览全部场景</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>基于 <code>three.js</code> + <code>WebXR</code> 构建 · 同一套代码适配网页与 Vision Pro</span>
      <span class="site-footer__links">
        <a href="./webgpu.html">WebGPU / TSL 实验场</a>
        <a href="./lab.html">场景实验室</a>
        <span id="footer-status"></span>
      </span>
    </footer>

    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
