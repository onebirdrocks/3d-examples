<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <title>场景查看 · Lumen Atlas</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236ea8ff'/%3E%3Cstop offset='1' stop-color='%23a06bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="viewer">
      <canvas id="scene-canvas" class="viewer__canvas"></canvas>

      <div class="viewer__top">
        <a class="back-link" href="./index.html">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M10 3L5 8l5 5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          场景索引
        </a>

        <div class="viewer__heading">
          <p class="viewer__eyebrow" id="scene-index">—</p>
          <h1 class="viewer__title">
            <span id="scene-title">加载中</span>
            <em id="scene-subtitle"></em>
          </h1>
        </div>

        <div class="viewer__tools">
          <div class="viewer__actions">
            <div class="audio-ctl" id="audio-ctl" hidden>
              <button class="icon-btn" id="sound-toggle" title="环境音" aria-label="开关环境音">
                <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path
                    d="M4 8v4h2.5L10 15V5L6.5 8H4z"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="1.2"
                    stroke-linejoin="round"
                  />
                  <path
                    id="sound-wave"
                    d="M13 7.2c.9.8 1.4 1.8 1.4 2.8s-.5 2-1.4 2.8M15.4 5c1.5 1.3 2.4 3 2.4 5s-.9 3.7-2.4 5"
                    stroke="currentColor"
                    stroke-width="1.3"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
              <input
                class="volume"
                id="volume"
                type="range"
                min="0"
                max="100"
                value="55"
                aria-label="环境音音量"
              />
              <button
                class="icon-btn"
                id="mixer-toggle"
                title="分层混音"
                aria-label="分层混音"
                aria-expanded="false"
                aria-controls="mixer"
                hidden
              >
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path
                    d="M4 4v12M10 4v12M16 4v12"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                  <circle cx="4" cy="8" r="2" fill="currentColor" />
                  <circle cx="10" cy="12" r="2" fill="currentColor" />
                  <circle cx="16" cy="6" r="2" fill="currentColor" />
                </svg>
              </button>
            </div>
            <button class="btn btn--ghost" id="enter-ar" aria-describedby="xr-status" disabled>放到真实空间</button>
            <button class="btn btn--primary" id="enter-xr" aria-describedby="xr-status" disabled>沉浸模式</button>
          </div>
          <p class="viewer__xr-status" id="xr-status" role="status">正在检查空间体验支持情况…</p>
          <div class="viewer__extras">
            <button class="text-control" id="favorite-scene" aria-pressed="false">收藏场景</button>
            <span class="session-countdown" id="session-countdown" aria-live="off"></span>
            <details class="experience-settings" id="experience-settings">
              <summary>体验设置</summary>
              <div class="settings-panel">
                <button class="text-control" id="close-settings">关闭设置</button>
                <label>画质<select id="quality-select"><option value="low">省电</option><option value="balanced">均衡</option><option value="high">清晰</option></select></label>
                <button class="btn btn--ghost" id="animation-toggle" aria-pressed="false">暂停画面</button>
                <label><span>减少动态</span><input id="reduced-motion" type="checkbox" /></label>
                <label><span>后台继续声音</span><input id="background-audio" type="checkbox" checked /></label>
                <label>定时结束<select id="session-duration"><option value="0">不限时</option><option value="5">5 分钟</option><option value="10">10 分钟</option><option value="20">20 分钟</option><option value="30">30 分钟</option><option value="60">60 分钟</option></select></label>
                <p class="settings-hint">结束前10秒声音逐渐减弱，时间到后静音并暂停画面。</p>
                <button class="btn btn--ghost" id="hide-controls">隐藏控制栏</button>
                <p class="settings-hint">轻点画面、点击显示按钮或按 Esc 可恢复控制栏。</p>
              </div>
            </details>
          </div>

          <div class="mixer" id="mixer" hidden>
            <p class="mixer__title">分层混音</p>
            <div class="mixer__rows" id="mixer-rows"></div>
          </div>
        </div>

        <div class="modes" id="modes" hidden></div>
      </div>

      <div class="xr-banner" id="xr-banner" role="status"></div>
      <button class="btn btn--ghost restore-controls" id="show-controls" hidden>显示控制栏</button>
      <section class="viewer-message" id="viewer-error" role="alert" hidden>
        <h2 id="viewer-error-title">场景暂不可用</h2>
        <p id="viewer-error-description"></p>
        <div class="message-actions"><button class="btn btn--primary" id="retry-scene">重试</button><a class="btn btn--ghost" href="./index.html">返回场景索引</a></div>
      </section>
      <section class="viewer-message" id="session-complete" role="status" hidden>
        <h2>本次体验已结束</h2>
        <p>声音已关闭，画面已暂停。愿这段光影给你片刻安静。</p>
        <div class="message-actions"><button class="btn btn--primary" id="continue-session">继续体验</button><a class="btn btn--ghost" href="./index.html">返回场景索引</a></div>
      </section>

      <div class="viewer__bottom">
        <div class="viewer__info">
          <p class="viewer__desc" id="scene-desc"></p>
          <ul class="viewer__tags" id="scene-tags"></ul>
        </div>

        <div class="viewer__nav">
          <button class="icon-btn" id="prev-scene" title="上一个场景" aria-label="上一个场景">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M10 3L5 8l5 5"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <select class="scene-select" id="scene-select" aria-label="选择场景"></select>
          <button class="icon-btn" id="next-scene" title="下一个场景" aria-label="下一个场景">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M6 3l5 5-5 5"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="viewer__loading" id="loading">
        <div class="spinner"></div>
        <span>正在生成场景</span>
      </div>
    </div>

    <div class="xr-overlay" id="ar-overlay" hidden>
      <div class="xr-overlay__card">
        <strong>把场景放进真实空间</strong>
        <span>缓慢移动视线，找到地面或桌面，出现蓝色圆环后捏合 / 点击即可放置。</span>
        <span class="xr-overlay__hint">退出沉浸模式可返回网页</span>
      </div>
    </div>

    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
