name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # 不让某一片失败就掐掉其它片，好一次看清到底哪几个场景有问题
      fail-fast: false
      matrix:
        # 48 个场景在软渲染的 runner 上串行要跑近一小时；
        # 拆成 6 片并行后总算力不变，墙钟时间降到约 1/6。
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 静态预览完整性检查
        run: npm run thumbnails:check

      - name: 场景回归检查
        # 逐个打开全部场景，检查控制台报错与黑屏
        run: npm run verify
        env:
          VERIFY_SHARD: ${{ matrix.shard }}
          VERIFY_SHARDS: 6

      - name: 场景页交互回归检查
        if: matrix.shard == 0
        run: npm run verify:viewer

      - name: 整体体验回归检查
        if: matrix.shard == 0
        run: npm run verify:experience
